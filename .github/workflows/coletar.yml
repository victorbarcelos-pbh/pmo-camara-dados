name: Coletar projetos de lei (CMBH)

on:
  schedule:
    # Segunda, 0h17 em Brasília: o GitHub atrasa o agendamento em 7 a 10 horas.
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: coletar
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes do leitor (amostras reais)
        run: python -m pytest -q testes
      - name: Coletar na CMBH
        env:
          # Opcional: sem a chave, o resumo por IA é pulado e a coleta segue.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELO: gemini-3.8-flash
          GEMINI_MODELO_RESERVA: gemini-pro-latest
        run: python -u coletar.py
      - name: Publicar se mudou
        run: |
          git config user.name "agente-camara"
          git config user.email "agente-camara@users.noreply.github.com"
          git add dados/projetos-de-lei.json
          if git diff --cached --quiet; then echo "Sem mudança."; exit 0; fi
          git commit -m "dados: coleta CMBH $(date -u +%Y-%m-%d)"
          git push
